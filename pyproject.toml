[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bluewhale-genai"
version = "0.4.0"
description = "Resume and job-description intelligence: RAG, hybrid search, an LLM gateway and bounded agent workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rohit Yeluri" }]
dependencies = [
  "pydantic>=2.6,<3",
  "numpy>=1.26",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "python-multipart>=0.0.9",
]

[project.scripts]
bluewhale-eval = "bluewhale.evals.run:main"
bluewhale-mcp = "bluewhale.mcp_server:main"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4", "psycopg-pool>=3.2,<4", "pgvector>=0.2.5,<1"]
embeddings = ["fastembed>=0.3,<1"]
aws = ["boto3>=1.34"]
azure = ["openai>=1.30,<2"]
docs = ["pypdf>=4.0", "python-docx>=1.1"]
ui = ["streamlit>=1.33", "requests>=2.31"]
mcp = ["mcp>=1.2"]
otel = ["opentelemetry-sdk>=1.24", "opentelemetry-exporter-otlp>=1.24"]
dev = ["pytest>=8", "httpx>=0.26", "ruff>=0.4", "mypy>=1.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bluewhale = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 105
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# FastAPI declares dependencies as argument defaults by design
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
